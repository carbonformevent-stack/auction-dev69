name: CI

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (RuboCop)
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  security:
    name: security (Brakeman, bundler-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  test:
    name: test (RSpec + SQLite)
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: test

    steps:
      # spec ไม่ต้องพึ่ง package นี้ (gem sqlite3 มี SQLite ในตัว, แอปไม่สร้าง variant รูป) — ติดตั้งไว้ให้เหมือนเครื่อง dev
      # mirror ของ Ubuntu ล่ม/DNS พังเคยทำให้ทั้ง job fail → ลองซ้ำ 3 รอบ จำกัดเวลา และไม่ให้ขั้นนี้ทำให้ job fail
      - name: Install packages
        continue-on-error: true
        timeout-minutes: 6
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update &&
              sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install --no-install-recommends -y libvips sqlite3 &&
              exit 0
            echo "apt attempt $attempt failed — retrying in 15s"; sleep 15
          done
          exit 1

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Chrome (system specs)
        uses: browser-actions/setup-chrome@v2

      - name: Build Tailwind CSS
        run: bin/rails tailwindcss:build

      - name: Prepare database
        run: bin/rails db:test:prepare

      - name: Run RSpec
        run: bundle exec rspec --format progress
